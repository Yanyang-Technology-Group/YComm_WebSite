# 重定向容器（供 cloudflared ingress 使用）
#
# 将旧子域 c.yanyn.cn / comm.yanyn.cn 的任意路径 301 到 canonical 域名
# community.yanyn.cn，保留路径与查询串。
#
# 用法（服务器上）：
#   mkdir -p /opt/ycomm/redirect
#   cp docker/redirect/nginx.conf /opt/ycomm/redirect/
#   docker run -d --name ycomm-redirect --restart unless-stopped -p 127.0.0.1:8082:80 \
#     -v /opt/ycomm/redirect/nginx.conf:/etc/nginx/conf.d/site.conf:ro nginx:alpine
#
# 然后把这两个 hostname 加进 cloudflared ingress，见 docs/CLOUDFLARE.md。

server {
    listen 80;
    server_name c.yanyn.cn comm.yanyn.cn;

    # 永久重定向到真实站点，保留路径与查询
    return 301 https://community.yanyn.cn$request_uri;
}