name: Release

# 版本编号格式（与 Yanyang_WebSite 保持一致）：
#   vYYYY.MM.DD.commits
# 其中 commits = 发布时点仓库的提交总数（git rev-list --count HEAD）
# 例如：v2026.09.12.257
#
# 触发方式：
#   1. push 到 main → 自动计算版本号并发布（tag + GHCR 镜像 + GitHub Release）
#   2. 手动运行（workflow_dispatch）→ 用输入框强制指定版本，不填则自动计算

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: '强制版本号（如 v2026.09.12.257），留空则自动计算'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm run test

      - name: AGPL license gate
        run: npm run licenses

  release:
    name: Version, image & release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- 版本号：vYYYY.MM.DD.commits --------------------------------
      - name: Resolve version
        id: resolve
        env:
          FORCED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$FORCED_VERSION" ]; then
            VERSION="$FORCED_VERSION"
          else
            COUNT=$(git rev-list --count HEAD)
            VERSION="v$(date +%Y.%m.%d).${COUNT}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 要求镜像仓库名全小写；org 本身可能含大写，这里统一小写化。
      - name: Resolve image name (GHCR requires lowercase)
        id: image
        run: |
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/ycomm-web"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${IMAGE}"

      - name: Build and push image
        id: image-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.resolve.outputs.version }}
            ${{ steps.image.outputs.image }}:latest
          # 把版本号注入镜像，footer 会展示 yyyy.mm.dd.commits。
          build-args: |
            APP_VERSION=${{ steps.resolve.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 打标签：保证 Release 与镜像版本一致 -------------------------
      # 镜像在上一步就已经推送成功，所以这一步无论如何都不应该让整个发布失败。
      # 已知失败场景：同名 tag 已存在（并发/重复触发），或 tag 指向的提交在远端
      # 不可达（force-push 后对象被回收）→ GitHub 报
      #   remote: fatal error in commit_refs
      #     ! [remote rejected] vX -> vX (failure)
      - name: Create git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 先同步远端 tag，避免本地看不到「并发运行刚建好的」同名 tag。
          git fetch --tags --force origin >/dev/null 2>&1 || true

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "tag $VERSION already exists on remote, skipping"
            exit 0
          fi

          git tag "$VERSION"
          for attempt in 1 2 3; do
            if git push origin "refs/tags/$VERSION"; then
              echo "tag $VERSION created"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying..."
            sleep 3
          done

          git tag -d "$VERSION" >/dev/null 2>&1 || true
          echo "::warning::tag $VERSION 推送失败；镜像 ${{ steps.image.outputs.image }}:$VERSION 已发布，部署不受影响"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          # 没有 tag 就不建 Release（否则 gh 会拿默认分支硬造一个 tag，版本对不上）。
          if ! git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::warning::tag $VERSION 不存在，跳过 Release；镜像已发布"
            exit 0
          fi

          BODY=$(cat <<'EOF'
          ## YComm ${{ steps.resolve.outputs.version }}

          版本号：vYYYY.MM.DD.<提交数>（与 Yanyang_WebSite 同格式）。

          ### 镜像（ghcr.io）
          - `${{ env.IMAGE }}:${{ env.VERSION }}`
          - `${{ env.IMAGE }}:latest`

          **Coolify 部署**：构建包选 `Docker Registry Image`，
          镜像地址填 `${{ env.IMAGE }}:${{ env.VERSION }}`，免源码构建直接运行。
          EOF
          )
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes "$BODY" --latest
          else
            gh release create "$VERSION" --title "YComm $VERSION" --notes "$BODY" --latest
          fi
