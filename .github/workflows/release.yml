name: Release

# 版本编号格式（与 Yanyang_WebSite 保持一致）：
#   vYYYY.MM.DD.commits
# 其中 commits = 发布时点仓库的提交总数（git rev-list --count HEAD）
# 例如：v2026.09.12.257
#
# 触发方式：
#   1. push 到 main → 自动计算版本号并发布（tag + GHCR 镜像 + GitHub Release）
#   2. 手动运行（workflow_dispatch）→ 用输入框强制指定版本，不填则自动计算

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: '强制版本号（如 v2026.09.12.257），留空则自动计算'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm run test

      - name: AGPL license gate
        run: npm run licenses

  release:
    name: Version, image & release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- 版本号：vYYYY.MM.DD.commits --------------------------------
      - name: Resolve version
        id: resolve
        env:
          FORCED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$FORCED_VERSION" ]; then
            VERSION="$FORCED_VERSION"
          else
            COUNT=$(git rev-list --count HEAD)
            VERSION="v$(date +%Y.%m.%d).${COUNT}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 要求镜像仓库名全小写；org 本身可能含大写，这里统一小写化。
      - name: Resolve image name (GHCR requires lowercase)
        id: image
        run: |
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/ycomm-web"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${IMAGE}"

      - name: Build and push image
        id: image-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.resolve.outputs.version }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 打标签：保证 Release 与镜像版本一致 -------------------------
      - name: Create git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if ! git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$VERSION"
            git push origin "refs/tags/$VERSION"
            echo "tag $VERSION created"
          else
            echo "tag $VERSION already exists, skipping"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          BODY=$(cat <<'EOF'
          ## YComm ${{ steps.resolve.outputs.version }}

          版本号：vYYYY.MM.DD.<提交数>（与 Yanyang_WebSite 同格式）。

          ### 镜像（ghcr.io）
          - `${{ env.IMAGE }}:${{ env.VERSION }}`
          - `${{ env.IMAGE }}:latest`

          **Coolify 部署**：构建包选 `Docker Registry Image`，
          镜像地址填 `${{ env.IMAGE }}:${{ env.VERSION }}`，免源码构建直接运行。
          EOF
          )
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes "$BODY" --latest
          else
            gh release create "$VERSION" --title "YComm $VERSION" --notes "$BODY" --latest
          fi

  # ---------------------------------------------------------------------
  # 部署：GHCR + 国内镜像源拉取（北京服务器）
  #   服务器从国内镜像源（默认 ghcr.nju.edu.cn，可用仓库变量 vars.GHCR_MIRROR 覆盖）
  #   拉取 ghcr.io 镜像，然后 docker run 到 coolify 网络（Postgres 由 Coolify 托管）。
  #   前置条件见仓库 README/部署说明：① GHCR 包设为 Public；② 服务器能访问镜像源。
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to Beijing server
    needs: release
    runs-on: ubuntu-latest
    steps:
      # 门控：secrets 没配好时整段跳过（不报红），避免公开仓库无服务器信息时误报失败。
      - name: Check deploy secrets
        id: gate
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "::notice::SERVER_HOST 未配置，跳过部署"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via GHCR mirror pull
        if: steps.gate.outputs.enabled == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          GHCR_MIRROR: ${{ vars.GHCR_MIRROR || 'ghcr.nju.edu.cn' }}
          IMAGE: ${{ needs.release.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SITE_NAME: ${{ secrets.SITE_NAME }}
          OWNER_USER: ${{ secrets.YCOMM_OWNER_USERNAME }}
          OWNER_EMAIL: ${{ secrets.YCOMM_OWNER_EMAIL }}
          OWNER_PASS: ${{ secrets.YCOMM_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$SERVER_SSH_KEY" > /tmp/deploy-key
          chmod 600 /tmp/deploy-key
          # OpenSSH 需要密钥以换行结尾，粘贴进 Secrets 时常缺
          [ "$(tail -c1 /tmp/deploy-key)" != "" ] && echo >> /tmp/deploy-key || true
          # 预检：只认 BEGIN OPENSSH PRIVATE KEY；PKCS#8（BEGIN PRIVATE KEY）加载不了，报错清晰
          ssh-keygen -y -f /tmp/deploy-key >/dev/null 2>&1 || {
            echo "::error::SERVER_SSH_KEY 无法被 OpenSSH 解析（需 BEGIN OPENSSH PRIVATE KEY 格式）"
            exit 3
          }
          SSH="ssh -i /tmp/deploy-key -p ${SERVER_PORT:-22} -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          $SSH "$SERVER_SSH_USER@$SERVER_HOST" 'echo AUTH_OK' || {
            echo "::error::SSH 认证失败 — 端口 ${SERVER_PORT:-22} / 用户 $SERVER_SSH_USER（检查 authorized_keys 与防火墙）"
            exit 4
          }
          # ghcr.io/org/ycomm-web -> 国内镜像源/org/ycomm-web
          MIRROR_IMAGE=$(echo "$IMAGE" | sed "s|^ghcr.io/|${GHCR_MIRROR}/|")
          echo "::notice::拉取 $MIRROR_IMAGE:$VERSION"
          # 先拉取：拉失败就中断，旧容器保持运行不动
          $SSH "$SERVER_SSH_USER@$SERVER_HOST" "docker pull '${MIRROR_IMAGE}:${VERSION}'"
          DATABASE_URL="postgres://ycomm:${DB_PASSWORD}@${DB_HOST}:5432/ycomm"
          $SSH "$SERVER_SSH_USER@$SERVER_HOST" "docker rm -f ycomm >/dev/null 2>&1 || true; docker run -d --name ycomm --restart unless-stopped --network coolify -p 127.0.0.1:3000:3000 \
            -e NODE_ENV=production \
            -e DATABASE_DRIVER=postgres \
            -e DATABASE_URL='${DATABASE_URL}' \
            -e SESSION_SECRET='${SESSION_SECRET}' \
            -e SITE_URL='${SITE_URL}' \
            -e SITE_NAME='${SITE_NAME}' \
            -e TRUST_PROXY_HEADERS=true \
            -e YCOMM_OWNER_USERNAME='${OWNER_USER}' \
            -e YCOMM_OWNER_EMAIL='${OWNER_EMAIL}' \
            -e YCOMM_OWNER_PASSWORD='${OWNER_PASS}' \
            '${MIRROR_IMAGE}:${VERSION}'"

      - name: Wait for healthy
        if: steps.gate.outputs.enabled == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          echo "$SERVER_SSH_KEY" > /tmp/deploy-key
          chmod 600 /tmp/deploy-key
          [ "$(tail -c1 /tmp/deploy-key)" != "" ] && echo >> /tmp/deploy-key || true
          SSH="ssh -i /tmp/deploy-key -p ${SERVER_PORT:-22} -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          for i in $(seq 1 60); do
            state=$($SSH "$SERVER_SSH_USER@$SERVER_HOST" "docker inspect --format '{{.State.Health.Status}}' ycomm" 2>/dev/null || echo starting)
            echo "[$i] health=$state"
            if [ "$state" = "healthy" ]; then
              echo "DEPLOY OK — https://community.yanyn.cn"
              exit 0
            fi
            sleep 5
          done
          echo "::error::容器 300 秒内未变为 healthy"
          exit 1