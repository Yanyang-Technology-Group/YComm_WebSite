name: Deploy to Server

# 部署模型：GitHub Actions 在 runner 上构建镜像（runner 访问 GitHub/Docker Hub 快），
# 通过 SSH 把镜像 `docker save | docker load` 推送到你服务器的本地 Docker，
# 然后 `docker run` 启动容器。
#
# 服务器不抓 GitHub、不拖 Docker Hub —— 两个对国内网络不稳定的上游全部绕开。
# Postgres 仍由 Coolify 托管（跑在 docker 网络 `coolify` 上），容器同名加入该网络。
#
# ⚠️ 注意：job 级 `if` 不能引用 secrets 上下文（GitHub 会判定
# "Invalid workflow file ... Unrecognized named-value: 'secrets'"，整个 run 0 个 job 直接失败）。
# 因此「未配置 SERVER_HOST 就跳过」的门控放在第一步里做，后续步骤用 step 级 if 串起来。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 门控：仓库 secrets 没配好时，只跑这一步然后其余步骤全部跳过（不报红）。
      - name: Check deploy secrets
        id: gate
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "::notice::SERVER_HOST 未配置，跳过部署（其余步骤将全部跳过）"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version (vYYYY.MM.DD.commits)
        if: steps.gate.outputs.enabled == 'true'
        id: version
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "version=v$(date +%Y.%m.%d).${COUNT}" >> "$GITHUB_OUTPUT"
          echo "version=v$(date +%Y.%m.%d).${COUNT}"

      - name: Build image on the runner
        if: steps.gate.outputs.enabled == 'true'
        run: |
          docker build -t ycomm-web:${{ steps.version.outputs.version }} .

      - name: Push image to server (docker save | ssh | docker load)
        if: steps.gate.outputs.enabled == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$SERVER_SSH_KEY" > /tmp/deploy-key
          chmod 600 /tmp/deploy-key
          # OpenSSH 需要密钥文件以换行结尾，否则报 "invalid format"（粘贴进 Secrets 时常缺）
          [ "$(tail -c1 /tmp/deploy-key)" != "" ] && echo >> /tmp/deploy-key || true
          # OpenSSH 只认自己的私钥格式（BEGIN OPENSSH PRIVATE KEY）。
          # Node/crypto 产出的 PKCS#8（BEGIN PRIVATE KEY）加载不了 → 先预检，报错清晰。
          ssh-keygen -y -f /tmp/deploy-key >/dev/null 2>&1 || {
            echo "::error::SERVER_SSH_KEY 无法被 OpenSSH 解析：不是 BEGIN OPENSSH PRIVATE KEY 格式（若是 Node 生成的 PKCS#8 需先转换）"
            exit 3
          }
          SSH="ssh -i /tmp/deploy-key -p ${SERVER_PORT:-22} -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          docker save ycomm-web:"$VERSION" | gzip | $SSH "$SERVER_SSH_USER@$SERVER_HOST" 'gunzip | docker load'

      - name: Run container
        if: steps.gate.outputs.enabled == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SITE_NAME: ${{ secrets.SITE_NAME }}
          OWNER_USER: ${{ secrets.YCOMM_OWNER_USERNAME }}
          OWNER_EMAIL: ${{ secrets.YCOMM_OWNER_EMAIL }}
          OWNER_PASS: ${{ secrets.YCOMM_OWNER_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$SERVER_SSH_KEY" > /tmp/deploy-key
          chmod 600 /tmp/deploy-key
          [ "$(tail -c1 /tmp/deploy-key)" != "" ] && echo >> /tmp/deploy-key || true
          SSH="ssh -i /tmp/deploy-key -p ${SERVER_PORT:-22} -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          DATABASE_URL="postgres://ycomm:${DB_PASSWORD}@${DB_HOST}:5432/ycomm"
          $SSH "$SERVER_SSH_USER@$SERVER_HOST" "docker rm -f ycomm >/dev/null 2>&1 || true; docker run -d --name ycomm --restart unless-stopped --network coolify -p 127.0.0.1:3000:3000 \
            -e NODE_ENV=production \
            -e DATABASE_DRIVER=postgres \
            -e DATABASE_URL='${DATABASE_URL}' \
            -e SESSION_SECRET='${SESSION_SECRET}' \
            -e SITE_URL='${SITE_URL}' \
            -e SITE_NAME='${SITE_NAME}' \
            -e TRUST_PROXY_HEADERS=true \
            -e YCOMM_OWNER_USERNAME='${OWNER_USER}' \
            -e YCOMM_OWNER_EMAIL='${OWNER_EMAIL}' \
            -e YCOMM_OWNER_PASSWORD='${OWNER_PASS}' \
            ycomm-web:${VERSION}"

      - name: Wait for healthy
        if: steps.gate.outputs.enabled == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          echo "$SERVER_SSH_KEY" > /tmp/deploy-key
          chmod 600 /tmp/deploy-key
          [ "$(tail -c1 /tmp/deploy-key)" != "" ] && echo >> /tmp/deploy-key || true
          SSH="ssh -i /tmp/deploy-key -p ${SERVER_PORT:-22} -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          timeout 300 bash -c 'for i in $(seq 1 60); do
            state=$($SSH "$SERVER_SSH_USER@$SERVER_HOST" "docker inspect --format '{{.State.Health.Status}}' ycomm 2>/dev/null || echo starting")
            echo "[$i] health=$state"
            [ "$state" = "healthy" ] && echo "DEPLOY OK (host: http://127.0.0.1:3000 on $SERVER_HOST)" && exit 0
            sleep 5
          done; exit 1'
